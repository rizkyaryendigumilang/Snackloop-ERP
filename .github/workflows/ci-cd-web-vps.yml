name: Web CI/CD to VPS

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'script.js'
      - 'style.css'
      - 'sw.js'
      - 'manifest.json'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'src/**'
      - 'vendor/**'
      - 'scripts/**'
      - 'icons/**'
      - '*.png'
      - '*.svg'
      - '*.ico'
      - '.github/workflows/ci-cd-web-vps.yml'
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'script.js'
      - 'style.css'
      - 'sw.js'
      - 'manifest.json'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'src/**'
      - 'vendor/**'
      - 'scripts/**'
      - 'icons/**'
      - '*.png'
      - '*.svg'
      - '*.ico'
      - '.github/workflows/ci-cd-web-vps.yml'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy to VPS after validation (check to deploy, uncheck for build-only)'
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: snackloop-vps-web-production
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build web app
    runs-on: ubuntu-latest
    steps:
      - name: Log execution context
        run: |
          echo "=== BUILD CONTEXT ==="
          echo "Git SHA: ${GITHUB_SHA}"
          echo "Ref: ${GITHUB_REF}"
          echo "Event: ${GITHUB_EVENT_NAME}"
          echo "Actor: ${GITHUB_ACTOR}"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run automated test suite
        run: npm test

      - name: Build production web bundle
        env:
          CI: true
        run: npm run build

      - name: Validate build output
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/script.js
          test -s dist/style.css
          test -s dist/manifest.json
          node scripts/validate-assets.js dist

      - name: Package web artifact
        run: tar -czf web-dist.tar.gz -C dist .

      - uses: actions/upload-artifact@v4
        with:
          name: snackloop-web-dist
          path: web-dist.tar.gz
          if-no-files-found: error
          retention-days: 14

  deploy-production:
    name: Deploy web to production VPS
    needs: build
    runs-on: ubuntu-latest
    if: |
      always() &&
      needs.build.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      (
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && (inputs.deploy == true || inputs.deploy == 'true'))
      )
    steps:
      - name: Log deployment context
        run: |
          echo "=== DEPLOYMENT CONTEXT ==="
          echo "Deploying Git SHA: ${GITHUB_SHA}"
          echo "Target Branch: ${GITHUB_REF_NAME}"
          echo "Trigger Event: ${GITHUB_EVENT_NAME}"
          echo "Trigger Actor: ${GITHUB_ACTOR}"
          echo "Target Host: 43.156.236.102"
          echo "Target Directory: /srv/www/snackloop"

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download web build artifact
        uses: actions/download-artifact@v4
        with:
          name: snackloop-web-dist
          path: ./artifact

      - name: Configure verified SSH with ControlMaster
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USERNAME }}
          VPS_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
          VPS_PORT: ${{ secrets.VPS_SSH_PORT || secrets.VPS_PORT || '2222' }}
        run: |
          set -euo pipefail

          # Validasi keberadaan secret wajib tanpa mengekspos nilainya
          test -n "${VPS_HOST:-}" || { echo "::error::Missing required secret VPS_HOST"; exit 1; }
          test -n "${VPS_USER:-}" || { echo "::error::Missing required secret VPS_USERNAME"; exit 1; }
          test -n "${VPS_KEY:-}" || { echo "::error::Missing required secret VPS_SSH_KEY"; exit 1; }
          [[ "${VPS_PORT}" =~ ^[0-9]+$ ]] && ((VPS_PORT > 0 && VPS_PORT < 65536)) || { echo "::error::Invalid SSH Port: ${VPS_PORT}"; exit 1; }

          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_KEY" | tr -d '\r' > "$HOME/.ssh/id_deploy"
          chmod 600 "$HOME/.ssh/id_deploy"

          # Deteksi port SSH aktif (prioritaskan VPS_PORT, fallback ke 22)
          CHOSEN_PORT="$VPS_PORT"
          if nc -z -w 3 "$VPS_HOST" "$CHOSEN_PORT" 2>/dev/null; then
            echo "SSH Port aktif terdeteksi: $CHOSEN_PORT"
          elif [ "$CHOSEN_PORT" != "22" ] && nc -z -w 3 "$VPS_HOST" 22 2>/dev/null; then
            CHOSEN_PORT="22"
            echo "Fallback ke SSH Port: 22"
          fi
          echo "ACTIVE_SSH_PORT=$CHOSEN_PORT" >> "$GITHUB_ENV"

          # Terapkan verifikasi host key dengan auto-scan port aktif sebagai fallback
          if [ -n "${VPS_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          else
            touch "$HOME/.ssh/known_hosts"
          fi
          ssh-keyscan -p "$CHOSEN_PORT" "$VPS_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null || true
          chmod 600 "$HOME/.ssh/known_hosts"

          # Konfigurasi SSH Client dengan ControlMaster multiplexing untuk mencegah connection timeout dan rate limiting
          printf '%s\n' \
            "Host vps-deploy" \
            "  HostName $VPS_HOST" \
            "  User $VPS_USER" \
            "  Port $CHOSEN_PORT" \
            "  IdentityFile $HOME/.ssh/id_deploy" \
            "  IdentitiesOnly yes" \
            "  StrictHostKeyChecking accept-new" \
            "  UserKnownHostsFile $HOME/.ssh/known_hosts" \
            "  ConnectTimeout 20" \
            "  ServerAliveInterval 10" \
            "  ServerAliveCountMax 3" \
            "  ControlMaster auto" \
            "  ControlPath $HOME/.ssh/cm-%r@%h:%p" \
            "  ControlPersist 180s" \
            "  BatchMode yes" > "$HOME/.ssh/config"
          chmod 600 "$HOME/.ssh/config"

      - name: Upload bundle and deployment script
        run: |
          set -euo pipefail
          chmod +x scripts/deploy-remote.sh
          scp ./artifact/web-dist.tar.gz vps-deploy:web-dist-${GITHUB_SHA}.tar.gz
          scp ./scripts/deploy-remote.sh vps-deploy:deploy-remote.sh

      - name: Deploy with atomic backup, sync, and verified rollback
        run: |
          set -euo pipefail
          ssh vps-deploy "bash ~/deploy-remote.sh '/srv/www/snackloop' 'snackloop' '${GITHUB_SHA}' < /dev/null && rm -f ~/deploy-remote.sh"
