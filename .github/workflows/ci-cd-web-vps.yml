name: Web CI/CD to VPS

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'script.js'
      - 'style.css'
      - 'sw.js'
      - 'manifest.json'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'scripts/**'
      - 'icons/**'
      - '*.png'
      - '*.svg'
      - '*.ico'
      - '.github/workflows/ci-cd-web-vps.yml'
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'script.js'
      - 'style.css'
      - 'sw.js'
      - 'manifest.json'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'scripts/**'
      - 'icons/**'
      - '*.png'
      - '*.svg'
      - '*.ico'
      - '.github/workflows/ci-cd-web-vps.yml'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy to VPS after validation; leave false for build-only checks'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: snackloop-web-production
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run automated test suite
        run: npm test
      - name: Build production web bundle
        env:
          CI: true
        run: npm run build
      - name: Validate build output
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/script.js
          test -s dist/style.css
          test -s dist/manifest.json
      - name: Package web artifact
        run: tar -czf web-dist.tar.gz -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: snackloop-web-dist
          path: web-dist.tar.gz
          if-no-files-found: error
          retention-days: 14

  deploy-production:
    name: Deploy web to production VPS
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy == true }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: snackloop-web-dist
          path: ./artifact
      - name: Configure verified SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USERNAME }}
          VPS_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PORT: ${{ secrets.VPS_PORT || secrets.VPS_SSH_PORT || '22' }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" || { echo "Missing required secret VPS_HOST"; exit 1; }
          test -n "$VPS_USER" || { echo "Missing required secret VPS_USERNAME"; exit 1; }
          test -n "$VPS_KEY" || { echo "Missing required secret VPS_SSH_KEY"; exit 1; }
          test -n "$VPS_SSH_KNOWN_HOSTS" || { echo "Missing required secret VPS_SSH_KNOWN_HOSTS (verified host key required)"; exit 1; }
          [[ "$VPS_PORT" =~ ^[0-9]+$ ]] && ((VPS_PORT > 0 && VPS_PORT < 65536)) || { echo "Invalid VPS_PORT"; exit 1; }
          
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_KEY" | tr -d '\r' > "$HOME/.ssh/id_deploy"
          chmod 600 "$HOME/.ssh/id_deploy"
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Upload validated bundle
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USERNAME }}
          VPS_PORT: ${{ secrets.VPS_PORT || secrets.VPS_SSH_PORT || '22' }}
        run: |
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes -i "$HOME/.ssh/id_deploy" -P "$VPS_PORT" ./artifact/web-dist.tar.gz "$VPS_USER@$VPS_HOST:web-dist-${GITHUB_SHA}.tar.gz"

      - name: Deploy with backup and rollback
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USERNAME }}
          VPS_PORT: ${{ secrets.VPS_PORT || secrets.VPS_SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i "$HOME/.ssh/id_deploy" -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "bash -s -- '/srv/www/snackloop' 'snackloop' '${GITHUB_SHA}'" <<'REMOTE'
          set -Eeuo pipefail
          live="$1"
          slug="$2"
          release="$3"
          [[ "$release" =~ ^[0-9a-f]{40}$ ]] || exit 1

          # 1. Pastikan direktori deployment ada dan dapat diakses user
          if [ ! -d "$live" ]; then
            mkdir -p "$live" 2>/dev/null || sudo mkdir -p "$live"
            sudo chown -R "$USER:$USER" "$live" 2>/dev/null || true
          fi
          test -d "$live" && test ! -L "$live" || { echo "Target must be an existing real directory: $live"; exit 1; }

          parent="$HOME/.deploy-$slug"
          stage="$parent/stage-$release"
          backup="$parent/backup-$release.tar.gz"
          mkdir -p "$parent"

          # Bersihkan staging lama jika ada
          rm -rf "$stage"
          mkdir -p "$stage"

          # 2. Trap Rollback Otomatis jika terjadi kegagalan unpacking, verifikasi, atau rsync
          trap 'status=$?; if [ "$status" -ne 0 ] && [ -s "$backup" ]; then echo "⚠️ Error encountered during deployment. Rolling back to previous release..."; mkdir -p "$stage/restore"; tar -xzf "$backup" -C "$stage/restore"; rsync -a --delete "$stage/restore/" "$live/"; echo "✅ Rollback completed successfully from $backup"; fi; rm -rf "$stage"; exit "$status"' ERR

          # 3. Unpack bundle ke staging terisolasi
          tar -xzf "$HOME/web-dist-$release.tar.gz" -C "$stage"
          test -s "$stage/index.html" || { echo "Validation error: index.html missing or empty in new release"; exit 1; }

          # 4. Buat backup rilis aktif sebelum menimpa (jika direktori tidak kosong)
          if [ -n "$(ls -A "$live" 2>/dev/null)" ]; then
            echo "Creating backup of current live release into $backup..."
            tar -czf "$backup" -C "$live" .
            test -s "$backup" || { echo "Failed to create backup archive"; exit 1; }
          else
            echo "Target $live is currently empty; skipping backup creation for fresh install."
          fi

          # 5. Sinkronisasi staging ke live secara atomik
          rsync -a --delete "$stage/" "$live/"

          # 6. Verifikasi integritas rilis di direktori live
          test -s "$live/index.html" || { echo "Deployment verification failed: index.html missing"; exit 1; }
          test -s "$live/script.js" || { echo "Deployment verification failed: script.js missing"; exit 1; }

          # 7. Bersihkan file sementara, PERTAHANKAN arsip backup untuk rollback manual
          rm -f "$HOME/web-dist-$release.tar.gz"
          rm -rf "$stage"
          trap - ERR

          echo "✅ Deployment successful to $live."
          if [ -s "$backup" ]; then
            echo "📦 Rollback archive retained at: $backup"
          fi
          REMOTE

      - name: Verify production deployment health check
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USERNAME }}
          VPS_PORT: ${{ secrets.VPS_PORT || secrets.VPS_SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          echo "Running post-deploy smoke test on VPS..."
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i "$HOME/.ssh/id_deploy" -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "bash -s" <<'CHECK'
          test -s /srv/www/snackloop/index.html || { echo "Health check failed: index.html missing or empty"; exit 1; }
          test -s /srv/www/snackloop/script.js || { echo "Health check failed: script.js missing or empty"; exit 1; }
          test -s /srv/www/snackloop/manifest.json || { echo "Health check failed: manifest.json missing or empty"; exit 1; }
          echo "✅ Production static assets verified healthy at /srv/www/snackloop"
          CHECK
