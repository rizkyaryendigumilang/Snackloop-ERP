name: Build Mobile Apps (Android APK & iOS IPA)

on:
  push:
    branches: [ "main" ]
    paths:
      - 'index.html'
      - 'script.js'
      - 'style.css'
      - 'sw.js'
      - 'manifest.json'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'scripts/**'
      - 'android/**'
      - 'ios/**'
      - 'icons/**'
      - '*.png'
      - '*.svg'
      - '.github/workflows/build-and-sync-vps.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ==========================================
  # Job 1: Build Android APK
  # ==========================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies
        run: npm ci

      - name: Run automated test suite
        run: npm test

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Compile Android APK (assembleDebug)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace
          cd ..

      - name: Prepare APK Output
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk snackloop-android-debug.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk app-latest.apk
          echo "Android Debug APK ready: snackloop-android-debug.apk"

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: snackloop-android-debug-apk
          path: snackloop-android-debug.apk
          retention-days: 14

      - name: Mobile Artifact Summary
        run: |
          echo "### Android APK Build Status :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "- **Package Name / App ID**: com.snackloop.erp" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Type**: Debug APK (ready to sideload and test on Android devices)" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact Name**: \`snackloop-android-debug-apk\`" >> $GITHUB_STEP_SUMMARY

  # ==========================================
  # Job 2: Build iOS IPA
  # ==========================================
  build-ios:
    name: Build iOS IPA
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run automated test suite
        run: npm test

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Archive Xcode Project (Unsigned)
        run: |
          cd ios/App
          xcodebuild archive \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
          cd ../..

      - name: Package Payload into unsigned IPA
        run: |
          cd ios/App
          rm -rf Payload
          mkdir -p Payload
          cp -R build/App.xcarchive/Products/Applications/App.app Payload/
          zip -r -y ../../snackloop-ios-unsigned.ipa Payload
          cp ../../snackloop-ios-unsigned.ipa ../../app-latest.ipa
          cd ../..
          echo "iOS IPA created successfully: snackloop-ios-unsigned.ipa"

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: snackloop-ios-unsigned-ipa
          path: snackloop-ios-unsigned.ipa
          retention-days: 14

      - name: Mobile Artifact Summary
        run: |
          echo "### iOS IPA Build Status :apple:" >> $GITHUB_STEP_SUMMARY
          echo "- **Bundle Identifier**: com.snackloop.erp" >> $GITHUB_STEP_SUMMARY
          echo "- **Signing Status**: Unsigned archive (packaged for sideload testing with AltStore / Sideloadly)" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact Name**: \`snackloop-ios-unsigned-ipa\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Prerequisites for TestFlight / Enterprise distribution**: Apple Developer Program account, distribution certificate (.p12), and mobile provisioning profile." >> $GITHUB_STEP_SUMMARY
