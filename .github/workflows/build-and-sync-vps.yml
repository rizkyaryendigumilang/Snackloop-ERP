name: Build Mobile Apps (Android APK & iOS IPA)

on:
  push:
    branches: [ "main" ]
    paths:
      - 'index.html'
      - 'script.js'
      - 'style.css'
      - 'sw.js'
      - 'manifest.json'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'src/**'
      - 'vendor/**'
      - 'scripts/**'
      - 'android/**'
      - 'ios/**'
      - '*.png'
      - '*.svg'
      - '.github/workflows/build-and-sync-vps.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ==========================================
  # Job 1: Build Android APK
  # ==========================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Install Dependencies
        run: npm ci

      - name: Run automated test suite
        run: npm test

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Compile Android APK (assembleDebug)
        run: |
          cd android
          for attempt in 1 2 3; do
            echo "Attempt $attempt: Compiling Android APK..."
            if ./gradlew assembleDebug --stacktrace --no-daemon; then
              break
            elif [ "$attempt" -eq 3 ]; then
              echo "Android compile failed after 3 attempts."
              exit 1
            fi
            echo "Attempt $attempt encountered network/transient error, retrying in 5s..."
            sleep 5
          done
          cd ..

      - name: Prepare APK Output
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/snackloop-v${VERSION}-android.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/snackloop-android-latest.apk
          echo "Android Debug APK ready: build-output/snackloop-v${VERSION}-android.apk"

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: snackloop-android-apk
          path: build-output/*.apk
          retention-days: 14

      - name: Mobile Artifact Summary
        run: |
          echo "### Android APK Build Status :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "- **Package Name / App ID**: com.snackloop.erp" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Type**: Debug APK (ready to sideload and test on Android devices)" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact Name**: \`snackloop-android-apk\`" >> $GITHUB_STEP_SUMMARY

  # ==========================================
  # Job 2: Build iOS IPA
  # ==========================================
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    continue-on-error: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Run automated test suite
        run: npm test

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Archive Xcode Project (Unsigned)
        run: |
          cd ios/App
          xcodebuild archive \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
          cd ../..

      - name: Package Payload into unsigned IPA
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p build-output
          cd ios/App
          rm -rf Payload
          mkdir -p Payload
          cp -R build/App.xcarchive/Products/Applications/App.app Payload/
          zip -r -y ../../build-output/snackloop-v${VERSION}-ios.ipa Payload
          cp ../../build-output/snackloop-v${VERSION}-ios.ipa ../../build-output/snackloop-ios-latest.ipa
          cd ../..
          echo "iOS IPA created successfully: build-output/snackloop-v${VERSION}-ios.ipa"

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: snackloop-ios-ipa
          path: build-output/*.ipa
          retention-days: 14

      - name: Mobile Artifact Summary
        run: |
          echo "### iOS IPA Build Status :apple:" >> $GITHUB_STEP_SUMMARY
          echo "- **Bundle Identifier**: com.snackloop.erp" >> $GITHUB_STEP_SUMMARY
          echo "- **Signing Status**: Unsigned archive (packaged for sideload testing with AltStore / Sideloadly)" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact Name**: \`snackloop-ios-ipa\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Prerequisites for TestFlight / Enterprise distribution**: Apple Developer Program account, distribution certificate (.p12), and mobile provisioning profile." >> $GITHUB_STEP_SUMMARY

  # ==========================================
  # Job 3: Publish GitHub Release (Auto Release with APK & IPA)
  # ==========================================
  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-android, build-ios]
    if: always() && needs.build-android.result == 'success'
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Create Release Directory
        run: mkdir -p release-assets

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: snackloop-android-apk
          path: release-assets/

      - name: Download iOS Artifacts (if available)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: snackloop-ios-ipa
          path: release-assets/

      - name: Prepare Release Notes & Changelog
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG_NAME="v${VERSION}-b${GITHUB_RUN_NUMBER}"
          
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV

          # Ambil commit pesan terakhir & ringkasan 10 commit terkini
          COMMIT_MSG=$(git log -1 --pretty=format:"%B")
          RECENT_LOGS=$(git log -10 --pretty=format:"* %s (%h - %an)")

          cat << 'EOF' > release_body.md
          ## 📱 SnackLoop ERP vVERSION_PLACEHOLDER (Build #RUN_PLACEHOLDER)

          Sistem Informasi Penjualan, Kasir POS & Manajemen Stok Multi-Gudang.

          ### 📦 Unduh Aplikasi (Download Installers)

          | Platform | Berkas | Ukuran | Deskripsi |
          | :--- | :--- | :--- | :--- |
          EOF

          # Ganti placeholder dengan versi dan nomor build
          sed -i "s/VERSION_PLACEHOLDER/${VERSION}/g" release_body.md
          sed -i "s/RUN_PLACEHOLDER/${GITHUB_RUN_NUMBER}/g" release_body.md

          for f in release-assets/*; do
            if [ -f "$f" ]; then
              FNAME=$(basename "$f")
              FSIZE=$(ls -lh "$f" | awk '{print $5}')
              if [[ "$FNAME" == *.apk ]]; then
                echo "| 🤖 **Android** | \`$FNAME\` | \`$FSIZE\` | Debug APK (Direct Sideload HP Android) |" >> release_body.md
              elif [[ "$FNAME" == *.ipa ]]; then
                echo "| 🍎 **iOS** | \`$FNAME\` | \`$FSIZE\` | Unsigned IPA (AltStore / Sideloadly) |" >> release_body.md
              fi
            fi
          done

          cat << 'EOF' >> release_body.md

          ---

          ### 🛠️ Keterangan Perbaikan & Perubahan Terbaru (Changelog)
          EOF

          echo "" >> release_body.md
          echo "**Pembaruan Terkini (Current Commit):**" >> release_body.md
          echo '```text' >> release_body.md
          echo "$COMMIT_MSG" >> release_body.md
          echo '```' >> release_body.md
          echo "" >> release_body.md
          echo "**Riwayat Perubahan Terkini:**" >> release_body.md
          echo "$RECENT_LOGS" >> release_body.md

          cat << 'EOF' >> release_body.md

          ---

          ### 📲 Petunjuk Pemasangan
          * **Android:** Unduh file `.apk` ke ponsel Android Anda. Buka file tersebut lalu izinkan instalasi dari sumber tidak dikenal (*Install Unknown Apps*).
          * **iOS:** Unduh file `.ipa` lalu pasang ke iPhone/iPad menggunakan aplikasi sideloading seperti **AltStore**, **Sideloadly**, atau **TrollStore**.
          EOF

      - name: Publish Release to GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Publishing release: $TAG_NAME..."
          gh release create "$TAG_NAME" \
            release-assets/* \
            --title "SnackLoop ERP v${VERSION} (Build #${GITHUB_RUN_NUMBER})" \
            --notes-file release_body.md \
            --generate-notes
